[project]
name = "csc-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49.0",
    "flask>=3.1.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
    "apscheduler>=3.10.0",
    "sqlalchemy>=2.0.0",
    "langfuse>=2.57.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "I001"]
"evals/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
